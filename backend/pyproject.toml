[project]
name = "palimpsest"
version = "0.1.0"
description = "Galactic archaeology workbench for stellar family reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy==8.0.1",
    "astroquery==0.4.11",
    "fastapi==0.143.0",
    "gaiadr3-zeropoint==0.1.0",
    "galpy==1.12.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "pydantic==2.14.0",
    "pyvo==1.9.1",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==6.0.0",
    "ruff==0.8.0",
    "mypy==1.11.0",
    "black==24.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::UserWarning:galpy",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "SIM103", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]